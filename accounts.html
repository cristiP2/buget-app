<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conturi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body id="view-accounts">
    <!-- LOADER -->
    <div id="app-loader">
        <div class="spinner"></div>
    </div>

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="modal-overlay" style="display:none; z-index:9999;">
        <div class="modal-content text-center" style="max-width: 350px;">
            <div id="login-form-section">
                <div class="mb-20"><i class="fas fa-shield-alt login-logo"></i></div>
                <h2 class="mb-10" id="login-greeting">Bine ai venit</h2>
                <p class="text-muted mb-20">Introdu codul de securitate</p>
                <div class="form-group mb-20 text-left">
                    <div class="input-with-icon"><i class="fas fa-lock"></i><input type="password" id="login-pin" placeholder="PIN" style="letter-spacing: 5px; font-size: 1.2rem; text-align: center;"></div>
                </div>
                <button class="btn-add w-100" onclick="verifyLogin()">Autentificare</button>
                <a href="#" onclick="showRecovery()" class="forgot-pin-link">Ai uitat PIN-ul?</a>
            </div>
            <div id="recovery-form-section" style="display:none;">
                <h3 class="mb-15 text-center" style="justify-content:center;">Recuperare</h3>
                <p class="text-muted mb-15" id="rec-question">Întrebare...</p>
                <div class="form-group mb-15"><input type="text" id="rec-answer" placeholder="Răspunsul tău"></div>
                <button class="btn-add w-100 mb-10" onclick="verifyRecovery()">Resetează PIN</button>
                <button class="btn-backup w-100" onclick="hideRecovery()">Înapoi</button>
            </div>
        </div>
    </div>

    <h2 class="mb-20">Portofel</h2>

    <div class="card">
        <h3><span class="text-green"><i class="fas fa-wallet"></i> Venituri</span> <button class="btn-small-add" onclick="addAccount('income')">+ Adaugă</button></h3>
        <div id="list-income-sources" class="account-list"></div>
    </div>

    <div class="card">
        <h3><span class="text-teal"><i class="fas fa-piggy-bank"></i> Economii</span> <button class="btn-small-add" onclick="addAccount('savings')">+ Adaugă</button></h3>
        <div id="list-savings" class="account-list"></div>
        <div class="text-right font-bold mt-10">Total: <span id="total-savings">0.00</span></div>
    </div>

    <div class="card">
        <h3><span class="text-red"><i class="fas fa-university"></i> Credite</span> <button class="btn-small-add" onclick="addAccount('debt')">+ Adaugă</button></h3>
        <div id="list-debts" class="account-list"></div>
        <div class="text-right font-bold mt-10">Total: <span id="total-debts">0.00</span></div>
    </div>

    <!-- MODAL CONTURI (Nou) -->
    <div id="account-modal" class="modal-overlay" onclick="if(event.target===this) closeAccountModal()" style="display:none;">
        <div class="modal-content">
            <div class="flex-between mb-15"><h3 id="acc-modal-title">Cont</h3><button onclick="closeAccountModal()" class="btn-icon"><i class="fas fa-times"></i></button></div>
            <form id="account-form">
                <input type="hidden" id="acc-id">
                <input type="hidden" id="acc-type">
                <div class="form-group mb-15">
                    <label>Nume</label>
                    <input type="text" id="acc-name" required>
                </div>
                <div class="form-group mb-15">
                    <label>Iconiță</label>
                    <div class="icon-selector">
                        <label><input type="radio" name="acc-icon" value="fa-wallet" checked><i class="fas fa-wallet"></i></label>
                        <label><input type="radio" name="acc-icon" value="fa-credit-card"><i class="fas fa-credit-card"></i></label>
                        <label><input type="radio" name="acc-icon" value="fa-money-bill-wave"><i class="fas fa-money-bill-wave"></i></label>
                        <label><input type="radio" name="acc-icon" value="fa-university"><i class="fas fa-university"></i></label>
                        <label><input type="radio" name="acc-icon" value="fa-piggy-bank"><i class="fas fa-piggy-bank"></i></label>
                        <label><input type="radio" name="acc-icon" value="fa-mobile-alt"><i class="fas fa-mobile-alt"></i></label>
                    </div>
                </div>
                <div class="form-group mb-15" id="acc-balance-group">
                    <label>Sold (RON)</label>
                    <input type="number" id="acc-balance" step="0.01">
                </div>
                <button type="submit" class="btn-add w-100">Salvează</button>
            </form>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Acasă</a>
        <a href="transactions.html" class="nav-btn"><i class="fas fa-list"></i> Tranzacții</a>
        <a href="accounts.html" class="nav-btn active"><i class="fas fa-wallet"></i> Conturi</a>
        <a href="settings.html" class="nav-btn"><i class="fas fa-cog"></i> Setări</a>
    </nav>
    <script src="script.js"></script>
</body>
</html>
