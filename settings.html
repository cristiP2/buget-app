<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setări</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body id="view-settings">
    <!-- LOADER -->
    <div id="app-loader">
        <div class="spinner"></div>
    </div>

    <!-- LOGIN OVERLAY (Adaugat pentru securitate) -->
    <div id="login-overlay" class="modal-overlay" style="display:none; z-index:9999;">
        <div class="modal-content text-center" style="max-width: 350px;">
            <div id="login-form-section">
                <div class="mb-20"><i class="fas fa-shield-alt login-logo"></i></div>
                <h2 class="mb-10" id="login-greeting">Bine ai venit</h2>
                <p class="text-muted mb-20">Introdu codul de securitate</p>
                <div class="form-group mb-20 text-left">
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-pin" placeholder="PIN" style="letter-spacing: 5px; font-size: 1.2rem; text-align: center;">
                    </div>
                </div>
                <button class="btn-add w-100" onclick="verifyLogin()">Autentificare</button>
                <a href="#" onclick="showRecovery()" class="forgot-pin-link">Ai uitat PIN-ul?</a>
            </div>

            <div id="recovery-form-section" style="display:none;">
                <h3 class="mb-15 text-center" style="justify-content:center;">Recuperare</h3>
                <p class="text-muted mb-15" id="rec-question">Întrebare...</p>
                <div class="form-group mb-15"><input type="text" id="rec-answer" placeholder="Răspunsul tău"></div>
                <button class="btn-add w-100 mb-10" onclick="verifyRecovery()">Resetează PIN</button>
                <button class="btn-backup w-100" onclick="hideRecovery()">Înapoi</button>
            </div>
        </div>
    </div>

    <h2 class="mb-20">Setări</h2>

    <div class="card">
        <h3>Date</h3>
        <div class="flex-between gap-10 mt-15">
            <button class="btn-backup" onclick="exportData()"><i class="fas fa-file-code"></i> Backup</button>
            <button class="btn-backup" onclick="triggerImport()"><i class="fas fa-upload"></i> Import</button>
        </div>
        <button class="btn-backup w-100 mt-15" onclick="openProfileModal()"><i class="fas fa-user-shield"></i> Profil & PIN</button>
        <input type="file" id="backup-file-input" accept=".json" style="display:none" onchange="importData(this)">
    </div>

    <div class="card">
        <h3>General</h3>
        <div class="form-group mt-15">
            <label>Valută</label>
            <select id="app-currency">
                <option value="RON">RON</option>
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="GBP">GBP</option>
                <option value="MDL">MDL</option>
            </select>
        </div>
    </div>

    <div class="card">
        <h3>Aspect</h3>
        <button onclick="toggleTheme()" class="btn-backup w-100 mt-15">
            <i class="fas fa-moon"></i> Schimbă Tema (Dark/Light)
        </button>
    </div>

    <div class="card">
        <h3>Categorii de Cheltuieli</h3>
        <div class="flex-between gap-10 mb-15 mt-15">
            <input type="text" id="new-cat-name" placeholder="Categorie nouă...">
            <button class="btn-small-add" onclick="addNewCategory()">Adaugă</button>
        </div>
        <div id="categories-list" class="flex-col gap-15"></div>
    </div>

    <!-- MODAL PROFIL -->
    <div id="profile-modal" class="modal-overlay" onclick="if(event.target===this) closeProfileModal()" style="display:none;">
        <div class="modal-content">
            <div class="flex-between mb-15"><h3>Profil & Securitate</h3><button onclick="closeProfileModal()" class="btn-icon"><i class="fas fa-times"></i></button></div>
            <div class="form-group mb-15">
                <label>Nume Utilizator</label>
                <div class="input-with-icon"><i class="fas fa-user"></i><input type="text" id="set-user" placeholder="Ex: Cristi"></div>
            </div>
            <div class="form-group mb-15">
                <label>PIN (Lasă gol pentru a dezactiva)</label>
                <div class="input-with-icon"><i class="fas fa-key"></i><input type="number" id="set-pin" placeholder="Ex: 1234"></div>
            </div>
            <div class="form-group mb-15">
                <label>Întrebare Securitate (Opțional)</label>
                <input type="text" id="set-sec-q" placeholder="Ex: Numele primului animal">
            </div>
            <div class="form-group mb-15">
                <label>Răspuns Securitate</label>
                <input type="text" id="set-sec-a" placeholder="Ex: Rex">
            </div>
            <button class="btn-add w-100" onclick="saveProfile()">Salvează</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Acasă</a>
        <a href="transactions.html" class="nav-btn"><i class="fas fa-list"></i> Tranzacții</a>
        <a href="accounts.html" class="nav-btn"><i class="fas fa-wallet"></i> Conturi</a>
        <a href="settings.html" class="nav-btn active"><i class="fas fa-cog"></i> Setări</a>
    </nav>
    <script src="script.js"></script>
</body>
</html>
