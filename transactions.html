<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranzacții</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>select option { background: var(--bg); color: var(--text); }</style>
</head>
<body id="view-transactions">
    <!-- LOADER -->
    <div id="app-loader">
        <div class="spinner"></div>
    </div>

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="modal-overlay" style="display:none; z-index:9999;">
        <div class="modal-content text-center" style="max-width: 350px;">
            <div id="login-form-section">
                <div class="mb-20"><i class="fas fa-shield-alt login-logo"></i></div>
                <h2 class="mb-10" id="login-greeting">Bine ai venit</h2>
                <p class="text-muted mb-20">Introdu codul de securitate</p>
                <div class="form-group mb-20 text-left">
                    <div class="input-with-icon"><i class="fas fa-lock"></i><input type="password" id="login-pin" placeholder="PIN" style="letter-spacing: 5px; font-size: 1.2rem; text-align: center;"></div>
                </div>
                <button class="btn-add w-100" onclick="verifyLogin()">Autentificare</button>
                <a href="#" onclick="showRecovery()" class="forgot-pin-link">Ai uitat PIN-ul?</a>
            </div>
            <div id="recovery-form-section" style="display:none;">
                <h3 class="mb-15 text-center" style="justify-content:center;">Recuperare</h3>
                <p class="text-muted mb-15" id="rec-question">Întrebare...</p>
                <div class="form-group mb-15"><input type="text" id="rec-answer" placeholder="Răspunsul tău"></div>
                <button class="btn-add w-100 mb-10" onclick="verifyRecovery()">Resetează PIN</button>
                <button class="btn-backup w-100" onclick="hideRecovery()">Înapoi</button>
            </div>
        </div>
    </div>

    <h2 class="mb-20">Istoric</h2>

    <div class="card flex-between">
        <h3 style="margin:0; border:none; padding:0;"><i class="fas fa-calendar-alt" style="margin-right:10px;"></i> Luna</h3>
        <input type="month" id="month-filter" onchange="applyMonthFilter()" style="width:auto;">
    </div>

    <div class="card">
        <h3>Calendar</h3>
        <div class="calendar-grid" id="calendar-view"></div>
    </div>

    <div class="card">
        <h3>Flux Financiar 
            <div style="display:flex; gap:10px;">
                <button class="btn-small-add" onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
                <button class="btn-small-add" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Excel</button>
                <button class="btn-small-add" onclick="openTransactionModal()">+ Adaugă</button>
            </div>
        </h3>
        <table>
            <thead><tr><th class="check-col"></th><th>Data</th><th>Descriere</th><th class="amount-col">Suma</th><th></th></tr></thead>
            <tbody id="transaction-list"></tbody>
        </table>
    </div>

    <!-- MODAL ADAUGARE (Copiat pentru acces rapid) -->
    <div id="transaction-modal" class="modal-overlay" onclick="if(event.target===this) closeTransactionModal()" style="display:none;">
        <div class="modal-content">
            <div class="flex-between mb-15"><h3>Tranzacție</h3><button onclick="closeTransactionModal()" class="btn-icon"><i class="fas fa-times"></i></button></div>
            <form id="transaction-form">
                <div class="form-row">
                    <div class="form-group"><label>Data</label><input type="date" id="t-date" required></div>
                    <div class="form-group"><label>Suma</label><input type="number" id="t-amount" step="0.01" required></div>
                </div>
                <div class="form-group mb-15"><label>Descriere</label><input type="text" id="t-desc" required></div>
                <div class="form-group mb-15"><label>Tip</label>
                    <select id="t-type" onchange="updateFormUI(); updateSelects();">
                        <option value="expense">Cheltuială</option>
                        <option value="income">Venit</option>
                        <option value="savings_in">Depunere Economii</option>
                        <option value="credit_payment">Plată Rată</option>
                    </select>
                </div>

                <div id="section-expense" class="dynamic-section mb-15" style="display:none;">
                    <label>Categorie</label>
                    <select id="t-category">
                        <option value="Alimente">Alimente</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilități">Utilități</option>
                        <option value="Locuință">Locuință</option>
                        <option value="Distracție">Distracție</option>
                        <option value="Sănătate">Sănătate</option>
                        <option value="Educație">Educație</option>
                        <option value="Altele">Altele</option>
                    </select>
                </div>

                <div id="section-income" class="dynamic-section bg-income mb-15"><select id="t-income-source"></select></div>
                <div id="section-savings" class="dynamic-section bg-savings mb-15"><select id="t-savings-account"></select></div>
                <div id="section-credit" class="dynamic-section bg-credit mb-15">
                    <div class="form-group mb-15"><label>Credit</label><select id="t-credit-account"></select></div>
                    <div class="form-row"><div class="form-group"><label>Principal</label><input type="number" id="t-principal" step="0.01"></div><div class="form-group"><label>Dobândă</label><input type="number" id="t-interest" step="0.01"></div></div>
                </div>

                <button type="submit" class="btn-add w-100">Salvează</button>
            </form>
        </div>
    </div>

    <!-- MODAL ZI CALENDAR -->
    <div id="day-modal" class="modal-overlay" onclick="if(event.target===this) closeDayModal()" style="display:none;">
        <div class="modal-content">
            <div class="flex-between mb-15">
                <h3 id="day-modal-title" style="border:none; margin:0;">Tranzacții</h3>
                <button onclick="closeDayModal()" class="btn-icon"><i class="fas fa-times"></i></button>
            </div>
            <div id="day-transactions-list" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Acasă</a>
        <a href="transactions.html" class="nav-btn active"><i class="fas fa-list"></i> Tranzacții</a>
        <a href="accounts.html" class="nav-btn"><i class="fas fa-wallet"></i> Conturi</a>
        <a href="settings.html" class="nav-btn"><i class="fas fa-cog"></i> Setări</a>
    </nav>
    <script src="script.js"></script>
</body>
</html>
