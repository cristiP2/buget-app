<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranzacții</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body id="view-transactions">
    <div style="display:flex; justify-content:space-between; align-items:center; max-width:1600px; margin:0 auto 20px auto; position:sticky; top:0; z-index:100; background:var(--bg); padding:10px 0; border-bottom:1px solid var(--border);">
        <h2 style="margin:0;">Istoric</h2>
        <input type="month" id="month-filter" onchange="applyMonthFilter()" style="padding: 5px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="card">
        <h3>Calendar</h3>
        <div class="calendar-grid" id="calendar-view"></div>
    </div>

    <div class="card">
        <h3>Flux Financiar <button class="btn-small-add" onclick="openTransactionModal()">+ Adaugă</button></h3>
        <table>
            <thead><tr><th class="check-col"></th><th>Data</th><th>Descriere</th><th class="amount-col">Suma</th><th></th></tr></thead>
            <tbody id="transaction-list"></tbody>
        </table>
    </div>

    <!-- MODAL ADAUGARE (Copiat pentru acces rapid) -->
    <div id="transaction-modal" class="modal-overlay" onclick="if(event.target===this) closeTransactionModal()">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><h3>Tranzacție</h3><button onclick="closeTransactionModal()" class="btn-icon"><i class="fas fa-times"></i></button></div>
            <form id="transaction-form">
                <div class="form-row">
                    <div class="form-group"><label>Data</label><input type="date" id="t-date" required></div>
                    <div class="form-group"><label>Suma</label><input type="number" id="t-amount" step="0.01" required></div>
                </div>
                <div class="form-group" style="margin-bottom:15px;"><label>Descriere</label><input type="text" id="t-desc" required></div>
                <div class="form-group" style="margin-bottom:15px;"><label>Tip</label>
                    <select id="t-type" onchange="updateFormUI(); updateSelects();">
                        <option value="expense">Cheltuială</option>
                        <option value="income">Venit</option>
                        <option value="savings_in">Depunere Economii</option>
                        <option value="credit_payment">Plată Rată</option>
                    </select>
                </div>
                <div id="section-income" class="dynamic-section bg-income"><select id="t-income-source"></select></div>
                <div id="section-savings" class="dynamic-section bg-savings"><select id="t-savings-account"></select></div>
                <div id="section-credit" class="dynamic-section bg-credit"><select id="t-credit-account"></select></div>
                <button type="submit" class="btn-add" style="width:100%">Salvează</button>
            </form>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Acasă</a>
        <a href="transactions.html" class="nav-btn active"><i class="fas fa-list"></i> Tranzacții</a>
        <a href="accounts.html" class="nav-btn"><i class="fas fa-wallet"></i> Conturi</a>
        <a href="settings.html" class="nav-btn"><i class="fas fa-cog"></i> Setări</a>
    </nav>
    <script src="script.js"></script>
</body>
</html>
